;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

#Configuracion del sistema de esp32cam
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; [OPT] 921600 acelera el flasheo ~8x. Si tu USB-serial no sube,
; baja a 460800 o vuelve a 115200.
upload_speed = 921600

board_build.f_cpu = 240000000L
board_build.flash_mode = qio

; [OPT] 80 MHz de flash: LittleFS lee HTML/CSS/JS al doble de velocidad.
; Si tras flashear hay boot-loop, tu módulo no aguanta → vuelve a 40000000L.
board_build.f_flash = 80000000L

board_build.partitions  = partitions_custom.csv
board_build.filesystem  = littlefs

monitor_rts = 0
monitor_dtr = 0

build_flags =
    -DCAMERA_MODEL_AI_THINKER
    ; [OPT] silencia el log interno del core (no afecta tus Serial.print)
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    espressif/esp32-camera@^2.0.0
    file://lib/ei-cleantech--vision-arduino-1.0.10-impulse.zip
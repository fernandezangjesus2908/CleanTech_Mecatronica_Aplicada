; https://docs.platformio.org/page/projectconf.html

#Configuracion del sistema de esp32cam
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200

board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csvt
board_build.filesystem = littlefs
extra_flags = -DLITTLEFS_FLASH_BASE=0x290000
board_build.partitions = partitions_custom.csv

monitor_rts = 0
monitor_dtr = 0

build_flags =
    -D CONFIG_LITTLEFS_CACHE_SIZE=4096
    -D CONFIG_LITTLEFS_PAGE_SIZE=256
    -D CONFIG_LITTLEFS_FOR_IDF_3_2=1
    -D CONFIG_ARDUINO_RUNNING_CORE=1
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192

lib_deps = 
    espressif/esp32-camera@^2.0.0
    
build_flags = 
    -DCAMERA_MODEL_AI_THINKER